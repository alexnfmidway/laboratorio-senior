<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escola de Microsserviços | .NET 10</title>
    <base href="/" />

    <!-- Placeholders do .NET 10 para WebAssembly e ImportMap -->
    <link rel="preload" id="webassembly" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap & CSS da Aplicação -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="BlazorFrontend.styles.css" />

    <!-- Mermaid.js para diagramas -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        if (window.mermaid) {
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
        }
    </script>

    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; font-family: 'Outfit', sans-serif;">
            <div style="font-size: 3rem; margin-bottom: 1rem; animation: spin 1s linear infinite;">⏳</div>
            <p style="font-size: 1.2rem; color: #0078d4; font-weight: 600;">Carregando Escola de Microsserviços...</p>
            <small style="color: #64748b;">Inicializando WebAssembly .NET 10</small>
        </div>
    </div>
    <div id="blazor-error-ui" style="display:none">
        Um erro não recuperável ocorreu. <a href="" class="reload">Recarregar</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
