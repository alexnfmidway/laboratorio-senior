server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — redireciona rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fallback se o navegador pedir blazor.webassembly.js sem fingerprint
    location = /_framework/blazor.webassembly.js {
        default_type application/javascript;
        rewrite ^ /_framework/blazor.webassembly.*.js break;
    }

    # Cache para assets estáticos do Blazor WASM
    location ~* \.(js|wasm|dll|dat|blat|pdb|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream text/css application/javascript application/json;
}
