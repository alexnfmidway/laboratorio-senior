version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  gatewayapi:
    build:
      context: .
      dockerfile: GatewayApi/Dockerfile
    container_name: gatewayapi
    ports:
      - "5000:8080" # ÚNICA PORTA DE ENTRADA PÚBLICA (API Gateway)!
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      - jaeger
      - orderapi

  orderapi:
    build:
      context: .
      dockerfile: OrderApi/Dockerfile
    container_name: orderapi
    # Portas fechadas para o exterior - apenas rede privada interna!
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - InventoryApiUrl=http://inventoryapi:8080
      - PaymentApiUrl=http://paymentapi:8080
    depends_on:
      - jaeger
      - inventoryapi
      - paymentapi

  inventoryapi:
    build:
      context: .
      dockerfile: InventoryApi/Dockerfile
    container_name: inventoryapi
    # Portas fechadas para o exterior - apenas rede privada interna!
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      - jaeger

  paymentapi:
    build:
      context: .
      dockerfile: PaymentApi/Dockerfile
    container_name: paymentapi
    # Portas fechadas para o exterior - apenas rede privada interna!
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      - jaeger
