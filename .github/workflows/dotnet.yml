name: .NET

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DistributedTracingDemo.slnx
      - run: dotnet build DistributedTracingDemo.slnx --no-restore --configuration Release
      - run: dotnet test DistributedTracingDemo.slnx --no-build --configuration Release
